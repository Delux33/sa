<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SA Demo UI - Современная панель управления для работы с API" />
    <title>SA Demo UI — API Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>System Analytics API Console</h1>
        <p>Современная панель для управления пользователями, питомцами и продуктами</p>
    </header>

    <main class="app-main">
        <section class="panel panel--tabs">
            <div class="tabs">
                <button class="tab active" data-tab="users">
                    <span class="tab-icon">👤</span>
                    <span class="tab-label">Пользователи</span>
                </button>
                <button class="tab" data-tab="pets">
                    <span class="tab-icon">🐾</span>
                    <span class="tab-label">Питомцы</span>
                </button>
                <button class="tab" data-tab="products">
                    <span class="tab-icon">📦</span>
                    <span class="tab-label">Продукты</span>
                </button>
            </div>

            <!-- Users Tab -->
            <div class="tab-content active" id="tab-users">
                <div class="panel-grid">
                    <div class="card">
                        <h2>
                            <span>Список пользователей</span>
                            <span class="badge" id="users-count">0</span>
                        </h2>
                        <div class="toolbar">
                            <button id="reload-users" class="btn btn-secondary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                                </svg>
                                Обновить
                            </button>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>Фамилия</th>
                                    <th>Отчество</th>
                                </tr>
                                </thead>
                                <tbody id="users-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Создать пользователя</h2>
                        <form id="create-user-form" class="form">
                            <label>
                                <span>Имя</span>
                                <input name="name" required placeholder="Введите имя..." />
                            </label>
                            <label>
                                <span>Фамилия</span>
                                <input name="lastname" placeholder="Введите фамилию..." />
                            </label>
                            <label>
                                <span>Отчество</span>
                                <input name="surname" placeholder="Введите отчество..." />
                            </label>
                            <button type="submit" class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Создать пользователя
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Pets Tab -->
            <div class="tab-content" id="tab-pets">
                <div class="panel-grid">
                    <div class="card">
                        <h2>
                            <span>Питомцы</span>
                            <span class="badge" id="pets-count">0</span>
                        </h2>
                        <div class="toolbar">
                            <button id="load-all-pets" class="btn btn-secondary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <path d="M12 16v-4M12 8h.01"/>
                                </svg>
                                Все питомцы
                            </button>
                        </div>
                        
                        <form id="load-user-pets-form" class="form form-inline">
                            <label>
                                <span>ID пользователя</span>
                                <input name="userId" type="number" min="1" placeholder="ID..." />
                            </label>
                            <label>
                                <span>Имя (точно)</span>
                                <input name="name" placeholder="Имя..." />
                            </label>
                            <label>
                                <span>Имя содержит</span>
                                <input name="nameContains" placeholder="Поиск..." />
                            </label>
                            <label>
                                <span>Страница</span>
                                <input name="page" type="number" min="0" value="0" />
                            </label>
                            <label>
                                <span>Размер</span>
                                <input name="size" type="number" min="1" value="10" />
                            </label>
                            <label>
                                <span>Сортировка</span>
                                <select name="sortBy">
                                    <option value="id">ID</option>
                                    <option value="name">Имя</option>
                                    <option value="ownerId">Владелец</option>
                                </select>
                            </label>
                            <label>
                                <span>Направление</span>
                                <select name="sortDir">
                                    <option value="ASC">По возрастанию</option>
                                    <option value="DESC">По убыванию</option>
                                </select>
                            </label>
                            <button type="submit" class="btn btn-secondary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"/>
                                    <path d="m21 21-4.35-4.35"/>
                                </svg>
                                Найти
                            </button>
                        </form>

                        <div id="pets-pagination" class="pagination"></div>

                        <div class="table-wrapper">
                            <table>
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>ID владельца</th>
                                </tr>
                                </thead>
                                <tbody id="pets-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Создать питомца</h2>
                        <form id="create-pet-form" class="form">
                            <label>
                                <span>ID владельца</span>
                                <input name="userId" type="number" min="1" required placeholder="ID пользователя..." />
                            </label>
                            <label>
                                <span>Имя питомца</span>
                                <input name="name" required placeholder="Имя питомца..." />
                            </label>
                            <button type="submit" class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Создать питомца
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Products Tab -->
            <div class="tab-content" id="tab-products">
                <div class="panel-grid">
                    <div class="card">
                        <h2>
                            <span>Список продуктов</span>
                            <span class="badge" id="products-count">0</span>
                        </h2>
                        <div class="toolbar">
                            <button id="reload-products" class="btn btn-secondary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                                </svg>
                                Обновить
                            </button>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Название</th>
                                    <th>Цена</th>
                                </tr>
                                </thead>
                                <tbody id="products-table-body"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Создать продукт</h2>
                        <form id="create-product-form" class="form">
                            <label>
                                <span>Название</span>
                                <input name="name" required placeholder="Название продукта..." />
                            </label>
                            <label>
                                <span>Цена</span>
                                <input name="price" type="number" min="0" step="0.01" required placeholder="0.00" />
                            </label>
                            <button type="submit" class="btn btn-primary">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12h14"/>
                                </svg>
                                Создать продукт
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <aside class="panel panel--log">
            <div class="card">
                <h2>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Лог запросов
                </h2>
                <pre id="log-output" class="log-output"></pre>
            </div>
        </aside>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
